name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # A fresh cache catches unpublished/missing tarballs hidden by local caches.
      - run: npm ci --engine-strict --cache "${RUNNER_TEMP}/wisp-npm-cache"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
